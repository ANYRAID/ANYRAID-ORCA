name: Build all

on:
  push:
    # Versioned releases use tags such as v2.4.0 or v2.4.0-beta.
    tags:
      - 'v*'

  schedule:
      - cron: '0 17 * * *' # run once a day at 1 AM Singapore time (UTC+8)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
  

jobs:
  # build_win.bat ships a test suite. Run it before the Windows builds.
  check_build_script:
    name: Windows build script tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      # Windows PowerShell rather than pwsh: the suite drives build_win.bat
      # through cmd, and the two differ in how they quote native arguments.
      - name: Run the build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

  build_linux:
    strategy:
      fail-fast: false
      # SELF_HOSTED skips arm64 (no arm self-hosted server). amd64's empty arch
      # is load-bearing: it keeps the historical 'linux-clang' deps cache key and
      # the unsuffixed asset names.
      matrix:
        include: ${{ fromJSON(vars.SELF_HOSTED
          && '[{"arch":"","os":"orca-lnx-server"}]'
          || '[{"arch":"","os":"ubuntu-24.04"},{"arch":"aarch64","os":"ubuntu-24.04-arm"}]') }}
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'ANYRAID/ANYRAID-ORCA') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: false
    secrets: inherit
  build_windows:
    name: Build Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # SELF_HOSTED skips arm64 (the self-hosted Windows server is x64-only).
      matrix:
        include: ${{ fromJSON(vars.SELF_HOSTED
          && '[{"arch":"x64","os":"orca-win-server","compiler":"clang"}]'
          || '[{"arch":"x64","os":"windows-latest","compiler":"clang"},{"arch":"arm64","os":"windows-11-arm","compiler":"clang"}]') }}
    needs: check_build_script
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && needs.check_build_script.result == 'success' && (github.event_name != 'schedule' || github.repository == 'ANYRAID/ANYRAID-ORCA') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      compiler: ${{ matrix.compiler }}
      build-deps-only: false
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_arch:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
    # macOS delivery is paused until ANYRAID explicitly decides to support
    # macOS users. Keep the job definition so it can be restored deliberately.
    if: ${{ false && !cancelled() && (github.event_name != 'schedule' || github.repository == 'ANYRAID/ANYRAID-ORCA') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: ${{ matrix.arch }}
      build-deps-only: false
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_universal:
    name: Build macOS Universal
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' && (github.event_name != 'schedule' || github.repository == 'ANYRAID/ANYRAID-ORCA') }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: universal
      macos-combine-only: true
    secrets: inherit
  # One test job per built arch, on the runner that built it.
  unit_tests_linux_x86_64:
    name: Linux x86_64
    needs: build_linux
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
      artifact: ${{ github.sha }}-tests-linux-x86_64
  unit_tests_linux_aarch64:
    name: Linux aarch64
    needs: build_linux
    if: ${{ !cancelled() && success() && !vars.SELF_HOSTED }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ubuntu-24.04-arm
      artifact: ${{ github.sha }}-tests-linux-aarch64
  unit_tests_windows_x64:
    name: Windows x64
    needs: build_windows
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      artifact: ${{ github.sha }}-tests-windows-x64
  unit_tests_windows_arm64:
    name: Windows arm64
    needs: build_windows
    if: ${{ !cancelled() && success() && !vars.SELF_HOSTED }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-11-arm
      artifact: ${{ github.sha }}-tests-windows-arm64
      test-dir: build-arm64/tests
  unit_tests_macos_arm64:
    name: macOS arm64
    needs: build_macos_arch
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      artifact: ${{ github.sha }}-tests-macos-arm64
      test-dir: build/arm64/tests
  # Slice a two-colour cube through every shipped printer so all custom g-code
  # (change_filament_gcode, machine start/end, etc.) is expanded - catches
  # slicing regressions the static profile checks and unit tests can't see.
  # This complements static profile validation by exercising the binary
  # produced for the current nightly or version tag.
  slice_check_linux:
    name: Slice check (Linux ${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }})
    needs: build_linux
    if: ${{ !cancelled() && success() }}
    # Follows whichever Linux leg built the validator.
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download profile validator
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }}
          path: validator-bin
      - name: Validate slice (expand custom g-code)
        timeout-minutes: 60
        run: |
          chmod +x validator-bin/OrcaSlicer_profile_validator
          ./validator-bin/OrcaSlicer_profile_validator -p "${{ github.workspace }}/resources/profiles" -s -l 2
  publish_test_results:
    name: Publish Test Results
    needs: [unit_tests_linux_x86_64, unit_tests_linux_aarch64, unit_tests_windows_x64, unit_tests_windows_arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
      # Best-effort: restricted token permissions may prevent writing the check, so
      # don't let a publish failure fail the run. The test jobs gate correctness.
      - name: Publish Test Results
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "test-results/**/*.xml"
      - name: Delete Test Results
        if: success()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: test-results-*
          failOnError: false
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Don't run scheduled builds on forks; skip entirely on self-hosted runners
    if: ${{ !cancelled() && !vars.SELF_HOSTED && (github.event_name != 'schedule' || github.repository == 'ANYRAID/ANYRAID-ORCA') }}

    runs-on: ${{ matrix.variant.runner }}
    env:
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
    - uses: actions/checkout@v7
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
        ver=V$ver_pure
        git_commit_hash="${{ github.sha }}"
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
      shell: bash
    - name: Compute the flatpak-builder cache key
      id: fp_cache_key
      run: echo "key=flatpak-builder-${{ matrix.variant.arch }}-${{ hashFiles('deps/**', 'scripts/flatpak/com.anyraid.anyraidorca.yml', 'scripts/flatpak/make_deps_tar.sh') }}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Save/restore flatpak-builder cache
      uses: actions/cache@v6
      with:
        path: .flatpak-builder
        key: ${{ steps.fp_cache_key.outputs.key }}
        restore-keys: flatpak-builder-${{ matrix.variant.arch }}-
    - name: Disable debug info for faster CI builds
      run: |
        sed -i '/^build-options:/a\  no-debuginfo: true\n  strip: true' \
          scripts/flatpak/com.anyraid.anyraidorca.yml
      shell: bash
    - name: Inject git commit hash into Flatpak manifest
      run: |
        sed -i "/name: ANYRAID-ORCA/{n;s|buildsystem: simple|buildsystem: simple\n    build-options:\n      env:\n        git_commit_hash: \"$git_commit_hash\"|}" \
          scripts/flatpak/com.anyraid.anyraidorca.yml
      shell: bash
    - name: Check the manifest keeps orca_deps cacheable
      run: ./scripts/flatpak/check_manifest_cacheable.sh
      shell: bash
    - name: Pack deps/ for the Flatpak manifest
      run: ./scripts/flatpak/make_deps_tar.sh
      shell: bash
    - uses: flatpak/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: ANYRAID-ORCA-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        manifest-path: scripts/flatpak/com.anyraid.anyraidorca.yml
        cache: false
        arch: ${{ matrix.variant.arch }}
        upload-artifact: false
    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@v7
      with:
        name: ANYRAID-ORCA-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        path: '/__w/ANYRAID-ORCA/ANYRAID-ORCA/ANYRAID-ORCA-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak'
